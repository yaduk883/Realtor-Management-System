name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow can only read code and publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a waiting one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Insert Supabase settings and check them
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          # Remove stray spaces or line breaks pasted into the secrets
          SUPABASE_URL=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]'); export SUPABASE_URL
          SUPABASE_ANON_KEY=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]'); export SUPABASE_ANON_KEY

          [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ] || { echo "::error::Add SUPABASE_URL and SUPABASE_ANON_KEY under Settings > Secrets and variables > Actions."; exit 1; }
          case "$SUPABASE_URL" in https://*.supabase.co) ;; *) echo "::error::SUPABASE_URL must look like https://xxxx.supabase.co"; exit 1;; esac

          # Stop the deploy if someone pasted the private admin key by mistake
          case "$SUPABASE_ANON_KEY" in sb_secret_*) echo "::error::That is a secret key. Use the anon / publishable key."; exit 1;; esac
          if [[ "$SUPABASE_ANON_KEY" == eyJ* ]]; then
            payload=$(echo "$SUPABASE_ANON_KEY" | cut -d. -f2 | tr '_-' '/+')
            payload="$payload$(printf '=%.0s' $(seq 1 $(( (4 - ${#payload} % 4) % 4 ))))"
            role=$(echo "$payload" | base64 -d 2>/dev/null | python3 -c 'import sys,json; print(json.load(sys.stdin).get("role",""))')
            [ "$role" = "service_role" ] && { echo "::error::That is the service_role key. Use the anon key."; exit 1; }
          fi

          mkdir dist
          python3 - <<'PY'
          import os, re, json
          s = open("index.html", encoding="utf-8").read()
          url = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_ANON_KEY"]
          # Replace the whole line, whatever placeholder text is currently in it
          s, n1 = re.subn(r'const SUPABASE_URL = ".*?";', lambda m: "const SUPABASE_URL = " + json.dumps(url) + ";", s, count=1)
          s, n2 = re.subn(r'const SUPABASE_ANON_KEY = ".*?";', lambda m: "const SUPABASE_ANON_KEY = " + json.dumps(key) + ";", s, count=1)
          assert n1 == 1 and n2 == 1, "Could not find the SUPABASE_URL / SUPABASE_ANON_KEY lines in index.html"
          open("dist/index.html", "w", encoding="utf-8").write(s)
          PY

          grep -q "YOUR-" dist/index.html && { echo "::error::Placeholders were not replaced."; exit 1; }
          touch dist/.nojekyll
          echo "Build OK"

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
